[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awf-tooling"
version = "0.6.1"
description = "AWF weather practice tooling and isolated PostgreSQL adapters"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "requests>=2.31", "pyarrow>=16", "psycopg[binary]>=3.2"]

[project.scripts]
awf = "awf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

